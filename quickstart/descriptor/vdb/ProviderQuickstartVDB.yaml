---
name: "ProviderQuickstartVDB"
version: "1"

dataSources:
  - name: "provider"
    description: "Deterministic project data owned by the official Kubling In-memory provider."
    dataSourceType: "PROVIDER_GRPC"
    configObject:
      address: "{{ PROVIDER_HOST }}"
      port: {{ PROVIDER_PORT }}
      securityConfig:
        mode: "PLAINTEXT"
      cache:
        enabled: false
      contributesToHealth: true
    schema:
      type: "PHYSICAL"
      cacheDefaultStrategy: "NO_CACHE"

rbacDataRoles: []
