name: JavaScript

on:
  pull_request:
    paths:
      - ".github/workflows/javascript.yml"
      - "javascript/**"
      - "scripts/check-javascript.sh"
  push:
    paths:
      - ".github/workflows/javascript.yml"
      - "javascript/**"
      - "scripts/check-javascript.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: javascript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate static contract
        run: bash scripts/check-javascript.sh

      - name: Start JavaScript sample
        working-directory: javascript
        run: docker compose up --wait --wait-timeout 180

      - name: Run query and mutation smoke test
        working-directory: javascript
        run: docker compose --profile test run --rm --no-deps smoke-test

      - name: Show logs after failure
        if: failure()
        working-directory: javascript
        run: docker compose logs --no-color

      - name: Remove JavaScript sample
        if: always()
        working-directory: javascript
        run: docker compose down --volumes --remove-orphans
