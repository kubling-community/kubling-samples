name: Endpoints sample

on:
  pull_request:
    paths:
      - ".github/workflows/endpoints.yml"
      - "endpoints/**"
      - "scripts/check-endpoints.sh"
  push:
    paths:
      - ".github/workflows/endpoints.yml"
      - "endpoints/**"
      - "scripts/check-endpoints.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endpoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate static contract
        run: bash scripts/check-endpoints.sh

      - name: Start Endpoints sample
        working-directory: endpoints
        run: docker compose up --wait --wait-timeout 180

      - name: Run endpoint and action smoke test
        working-directory: endpoints
        run: docker compose --profile test run --rm smoke-test

      - name: Show logs after failure
        if: failure()
        working-directory: endpoints
        run: docker compose logs --no-color

      - name: Remove Endpoints sample
        if: always()
        working-directory: endpoints
        run: docker compose down --volumes --remove-orphans
