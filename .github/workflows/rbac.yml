name: RBAC sample

on:
  pull_request:
    paths:
      - ".github/workflows/rbac.yml"
      - "rbac/**"
      - "scripts/check-rbac.sh"
  push:
    paths:
      - ".github/workflows/rbac.yml"
      - "rbac/**"
      - "scripts/check-rbac.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate static contract
        run: bash scripts/check-rbac.sh

  e2e:
    name: Docker E2E
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Start RBAC sample
        working-directory: rbac
        run: docker compose up --wait --wait-timeout 180

      - name: Run SQL authentication and authorization smoke test
        working-directory: rbac
        run: docker compose --profile test run --rm smoke-test

      - name: Show logs after failure
        if: failure()
        working-directory: rbac
        run: docker compose logs --no-color

      - name: Remove RBAC sample
        if: always()
        working-directory: rbac
        run: docker compose down --volumes --remove-orphans
