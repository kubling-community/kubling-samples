name: kubling-initializer

services:
  descriptor-builder:
    image: docker.io/kubling/kubling-cli:latest
    command:
      - bundle
      - genmod
      - /descriptor
      - --output
      - /bundle/initializer-descriptor.zip
      - --parse
    volumes:
      - ./descriptor:/descriptor:ro
      - generated-bundles:/bundle

  module-builder:
    image: docker.io/kubling/kubling-cli:latest
    command:
      - bundle
      - genmod
      - /module
      - --output
      - /bundle/initializer-module.zip
      - --parse
    volumes:
      - ./module:/module:ro
      - generated-bundles:/bundle

  kubling:
    image: ${KUBLING_IMAGE:-docker.io/kubling/kubling:latest}
    environment:
      APP_CONFIG: /initializer/app-config.yaml
      DESCRIPTOR_BUNDLE: /initializer/bundle/initializer-descriptor.zip
      ENABLE_WEB_CONSOLE: "true"
      INITIALIZER_MODULE_BUNDLE: /initializer/bundle/initializer-module.zip
      MAIN_HTTP_PORT: "8282"
    depends_on:
      descriptor-builder:
        condition: service_completed_successfully
      module-builder:
        condition: service_completed_successfully
    ports:
      - "8282:8282"
    volumes:
      - ./app-config.yaml:/initializer/app-config.yaml:ro
      - generated-bundles:/initializer/bundle:ro

  stack-readiness:
    image: docker.io/curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    depends_on:
      kubling:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://kubling:8282/observe/health
      interval: 2s
      timeout: 5s
      retries: 60

  smoke-test:
    image: docker.io/curlimages/curl:latest
    profiles:
      - test
    environment:
      KUBLING_BASE_URL: http://kubling:8282
      KUBLING_VDB: InitializerVDB
    depends_on:
      stack-readiness:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/smoke-test.sh"]
    volumes:
      - ./scripts/smoke-test.sh:/scripts/smoke-test.sh:ro

volumes:
  generated-bundles:
